name: Site checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate assets and links
        run: python3 -m unittest discover -s tests -v
      - name: Check JavaScript syntax and behavior
        run: |
          node --check script.js
          node --test tests/site.test.cjs
